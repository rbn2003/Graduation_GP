<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graduation GP · Lock screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Titillium+Web:ital,wght@0,400;0,600;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#090B0F;--ink:#fff;--mute:#8D93A1;--line:#232833;--red:#E10600;--gold:#FFD700;--amber:#F59E0B;--violet:#B138DD;--teal:#00D2BE;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:#000;color:var(--ink);font-family:'Titillium Web',system-ui,sans-serif;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100%;max-height:900px;margin:auto;display:flex;flex-direction:column;align-items:center;padding:20px 22px 18px;background:radial-gradient(120% 60% at 50% 38%,rgba(225,6,0,.16),transparent 70%),var(--bg);position:relative;overflow:hidden}
@media(min-width:500px){.phone{border-radius:44px;border:1px solid var(--line);height:min(900px,96%)}}
.clock{text-align:center;margin-top:6px}
.date{color:var(--mute);font-size:15px;font-weight:600}
.time{font-size:58px;font-weight:600;line-height:1;letter-spacing:-1px;margin-top:2px}
.ring{width:100%;max-width:340px;flex:0 1 auto;margin-top:14px;position:relative}
.ring svg{width:100%;height:auto;display:block}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.days{font-size:clamp(76px,22vw,104px);font-style:italic;font-weight:900;line-height:.9;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.unit{color:var(--mute);font-size:15px;margin-top:4px}
.hms{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:17px;color:var(--gold);margin-top:8px;font-variant-numeric:tabular-nums}
.status{margin-top:12px;text-align:center;min-height:50px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:14px;font-weight:600;border:1px solid currentColor}
.sub{color:var(--mute);font-size:14px;margin-top:7px}
.stints{display:flex;gap:4px;width:100%;margin-top:14px}
.seg{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--red)}
.seg.pit i{background:var(--amber)}
.legend{display:flex;justify-content:space-between;width:100%;color:var(--mute);font-size:12px;margin-top:6px}
.next{width:100%;margin-top:14px;padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.next b{font-weight:600}.next span{color:var(--mute);white-space:nowrap}
.tray{width:100%;margin-top:auto;padding-top:14px}
.tray .row{display:flex;gap:8px;align-items:center}
.tray input{flex:1;accent-color:var(--red);min-width:0;height:28px}
button{font:600 13px 'Titillium Web',system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:99px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tag{color:var(--mute);font-size:12px;text-align:center;margin-top:8px}
@media(max-height:760px){.time{font-size:46px}.ring{max-width:280px}.sub{display:none}.status{min-height:0}}
.wpp .clock{visibility:hidden}
.wp .tray,.wp .next{display:none}
.wp .status{margin-top:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="phone">
  <div class="clock"><div class="date" id="date"></div><div class="time" id="time"></div></div>

  <div class="ring">
    <svg viewBox="0 0 300 300" role="img" aria-label="Race track ring with a car showing progress through the school year">
      <circle cx="150" cy="150" r="96" fill="none" stroke="#3B331E" stroke-width="10"/>
      <circle cx="150" cy="150" r="96" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="4 5" opacity=".8"/>
      <circle cx="150" cy="150" r="128" fill="none" stroke="#1D222C" stroke-width="22"/>
      <circle cx="150" cy="150" r="128" fill="none" stroke="#4B5568" stroke-width="1.2" stroke-dasharray="5 7"/>
      <circle id="arc" cx="150" cy="150" r="128" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 150 150)"/>
      <rect x="146" y="12" width="8" height="26" fill="#fff"/><rect x="146" y="12" width="4" height="13" fill="#111"/><rect x="150" y="25" width="4" height="13" fill="#111"/>
      <g id="car"><circle id="halo" r="13" fill="rgba(225,6,0,.25)" stroke="var(--red)" stroke-width="1.5"/>
        <rect x="-9" y="-4" width="14" height="8" rx="2" fill="#E10600"/><rect x="-6" y="-1" width="10" height="2" fill="#fff"/>
        <rect x="-10" y="-5.5" width="3" height="11" rx="1" fill="#fff"/><rect x="5" y="-5.5" width="3" height="11" rx="1" fill="#fff"/><circle cx="-1" r="1.8" fill="#FFD700"/></g>
    </svg>
    <div class="center"><div class="days" id="days">0</div><div class="unit">days to graduation</div><div class="hms" id="hms">00:00:00</div></div>
  </div>

  <div class="status"><span class="pill" id="pill"></span><div class="sub" id="sub"></div></div>
  <div class="stints" id="stints" aria-hidden="true"></div>
  <div class="legend"><span>Fall</span><span>Winter</span><span>Spring</span><span>Jun 14, 2027</span></div>
  <div class="next"><b id="nextDesc"></b><span id="nextDate"></span></div>

  <div class="tray">
    <div class="row">
      <button id="live">Today</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Preview a date in the school year">
      <button id="play">Play</button>
    </div>
    <div class="tag" id="tag"></div>
  </div>
</main>

<script>
const D=(y,m,d,h=0)=>new Date(y,m-1,d,h,0,0);
const START=D(2026,9,21),GRAD=D(2027,6,14,9);
const STINTS=[
 {t:'lap',n:1,name:'Fall term',s:D(2026,9,21),e:D(2026,12,14),f:[D(2026,12,7),D(2026,12,12)]},
 {t:'pit',n:1,name:'Winter break',s:D(2026,12,14),e:D(2027,1,4)},
 {t:'lap',n:2,name:'Winter term',s:D(2027,1,4),e:D(2027,3,20),f:[D(2027,3,15),D(2027,3,20)]},
 {t:'pit',n:2,name:'Spring break',s:D(2027,3,20),e:D(2027,3,29)},
 {t:'lap',n:3,name:'Spring term',s:D(2027,3,29),e:GRAD,f:[D(2027,6,7),D(2027,6,12)]}];
const MS=[[D(2026,12,7),'Fall finals begin'],[D(2026,12,14),'Pit stop 1: winter break'],[D(2027,1,4),'Lap 2 starts'],[D(2027,3,15),'Winter finals begin'],[D(2027,3,20),'Pit stop 2: spring break'],[D(2027,3,29),'Final lap starts'],[D(2027,6,7),'Spring finals begin'],[GRAD,'Chequered flag: graduation']];
const $=id=>document.getElementById(id);
const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const segs=STINTS.map(s=>{const e=document.createElement('div');e.className='seg'+(s.t==='pit'?' pit':'');e.style.flex=(s.e-s.s)/864e5;e.innerHTML='<i></i>';$('stints').appendChild(e);return e});
let live=true,sim=Date.now(),playing=false,last=0,raf;

function render(){
 const now=live?new Date():new Date(sim),ms=+now,real=new Date();
 $('date').textContent=real.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 $('time').textContent=real.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});
 const left=Math.max(0,Math.floor((GRAD-ms)/1000)),p2=n=>String(n).padStart(2,'0');
 $('days').textContent=Math.floor(left/86400);
 $('hms').textContent=p2(Math.floor(left%86400/3600))+':'+p2(Math.floor(left%3600/60))+':'+p2(left%60);

 let cur=STINTS.find(s=>ms>=s.s&&ms<s.e),p=0,color='var(--red)',label,sub;
 const done=ms>=GRAD;
 if(done){cur=STINTS[4];p=1;color='var(--teal)';label='Chequered flag. You graduated!';sub='P1 on June 14, 2027.'}
 else if(!cur){cur=STINTS[0];label='Grid ready';sub='Lights out on September 21.';color='var(--teal)'}
 else{
  p=(ms-cur.s)/(cur.e-cur.s);
  if(cur.t==='pit'){color='var(--amber)';label='Box box: pit stop '+cur.n;sub=cur.name+' · recharge before lap '+(cur.n+1)}
  else{const fin=cur.f&&ms>=cur.f[0]&&ms<cur.f[1];
   color=fin?'var(--violet)':(cur.n===3?'var(--gold)':'var(--red)');
   label=(cur.n===3?'Final lap':'Lap '+cur.n+' of 3')+(fin?' · finals sprint':'');
   sub=cur.name+' · '+Math.round(p*100)+'% complete'}
 }
 $('pill').textContent=label;$('pill').style.color=color;$('sub').textContent=sub;

 const pit=cur.t==='pit'&&!done,r=pit?96:128,a=(p*360-90)*Math.PI/180;
 $('car').setAttribute('transform',`translate(${150+r*Math.cos(a)} ${150+r*Math.sin(a)}) rotate(${p*360})`);
 $('halo').setAttribute('stroke',color);
 $('arc').setAttribute('stroke',color);
 $('arc').setAttribute('stroke-dasharray',(pit?0:p*100)+' 100');
 STINTS.forEach((s,i)=>{segs[i].firstChild.style.width=Math.min(100,Math.max(0,(ms-s.s)/(s.e-s.s)*100))+'%'});

 const nx=MS.find(m=>ms<m[0]);
 $('nextDesc').textContent=nx?nx[1]:'Finish line crossed';
 $('nextDate').textContent=nx?fmt(nx[0])+' · '+Math.ceil((nx[0]-ms)/864e5)+'d':'';
 $('scrub').value=Math.round(Math.min(1,Math.max(0,(ms-START)/(GRAD-START)))*1000);
 $('tag').textContent=live?'Live':'Previewing '+fmt(now)+', '+now.getFullYear();
}
function step(t){if(!playing)return;const dt=last?t-last:0;last=t;sim+=dt*1380000;
 if(sim>=GRAD){sim=+GRAD;stop()}render();if(playing)raf=requestAnimationFrame(step)}
function stop(){playing=false;cancelAnimationFrame(raf);$('play').textContent='Play'}
$('play').onclick=()=>{if(playing){stop();return}live=false;if(sim>=+GRAD||sim<+START)sim=+START;playing=true;last=0;$('play').textContent='Pause';raf=requestAnimationFrame(step)};
$('live').onclick=()=>{stop();live=true;render()};
$('scrub').oninput=e=>{stop();live=false;sim=+START+e.target.value/1000*(GRAD-START);render()};
if(location.hash.startsWith('#wallpaper'))document.body.classList.add('wp');
if(location.hash==='#wallpaper-phone')document.body.classList.add('wpp');
render();setInterval(()=>{if(live)render()},1000);
</script>
</body>
</html>
